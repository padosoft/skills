name: Bug report
description: A rule is not detected, a linter false positive, a script that breaks
labels: [bug]
body:
  - type: input
    id: rule
    attributes:
      label: Rule involved (R-xxx)
      placeholder: R-101
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce it
      description: The command you ran and a minimal HTML snippet
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs observed behaviour
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Python 3.12, macOS 15, client: Claude Code"
