name: Bug report
description: Una regola non viene rilevata, un falso positivo del linter, uno script che rompe
labels: [bug]
body:
  - type: input
    id: rule
    attributes:
      label: Regola coinvolta (R-xxx)
      placeholder: R-101
  - type: textarea
    id: repro
    attributes:
      label: Come riprodurlo
      description: Comando eseguito e frammento HTML minimo
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento atteso vs osservato
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Ambiente
      placeholder: "Python 3.12, macOS 15, client: Claude Code"
