name: Rule proposal
description: Propose a new R-xxx rule or a change to an existing one
labels: [rule]
body:
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Mailtrap/MailUp report, a client screenshot or a test that demonstrates the problem. Rules without evidence are not accepted.
    validations:
      required: true
  - type: dropdown
    id: level
    attributes:
      label: Proposed level
      options: [MUST, SHOULD, MAY]
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Recommended replacement
      description: The HTML pattern that fixes it, in the style of the existing rules
    validations:
      required: true
