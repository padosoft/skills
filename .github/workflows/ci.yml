name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  EMAIL_SKILL: skills/padosoft-email-html-builder

jobs:
  skills:
    name: Validate skills, catalog and linter
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Every SKILL.md follows the Agent Skills specification
        run: |
          for d in skills/*/; do
            python3 "$EMAIL_SKILL/scripts/validate_skill.py" "$d"
          done

      - name: Catalog, profiles and router aligned with the frontmatter
        run: python3 scripts/build_catalog.py --check

      - name: Plugin manifests consistent
        run: python3 scripts/validate_plugins.py

      - name: Tests
        run: python3 -m unittest discover -s tests -v

      - name: The reference template must pass the linter
        run: python3 "$EMAIL_SKILL/scripts/lint_email.py" "$EMAIL_SKILL/templates/reference-welcome-dark.html"

      - name: The anti-pattern fixture must fail
        run: |
          if python3 "$EMAIL_SKILL/scripts/lint_email.py" tests/fixtures/bad-email.html > /dev/null; then
            echo "::error::The bad-email.html fixture should fail the lint"; exit 1
          fi

      - name: The installer works in dry-run
        run: bash scripts/install-profile.sh core --dry-run
