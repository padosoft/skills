name: Skills audit

# Copy this file to .github/workflows/skills-audit.yml in a project that keeps Agent Skills
# (.claude/skills, .agents/skills, .claude/commands).
#
# It runs the deterministic checker of padosoft-skill-audit: offline, Python standard library only, no secret,
# no model. It REPORTS and never edits:
#   - on every pull request, an ERROR-level finding fails the check (it is quick, and a workflow with a path
#     filter would leave a required check waiting forever on the pull requests it skips);
#   - every week it keeps ONE open issue labelled "skills-audit" with the full report (warnings included) and
#     closes it when the report is clean.
# Fixing is a judgement job: open a session in the repository and ask the skill to apply the report.
#
# Two jobs, so that the one that reads the repository cannot write issues. "audit" has a read-only token and no
# persisted credentials; "report" has the issues permission and never checks the repository out. The checker is
# always the pinned release downloaded below, never a copy found in the checkout: a pull request could replace it.
#
# Whether the RULES are still current is checked centrally in padosoft/skills. A project does not need to check
# that: it gets new rules by updating the skill, and then bumps SKILLS_REF below to the release it installed.

on:
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: skills-audit-${{ github.ref }}
  cancel-in-progress: false

env:
  # The padosoft/skills release the checker comes from, as the full 40-character commit of the release with its
  # tag in a comment (gh api repos/padosoft/skills/commits/vX.Y.Z -q .sha). A tag can be moved and a branch
  # moves by itself; a script fetched from either is code you did not review. Bump it when you update the skill.
  SKILLS_REF: 5ce8aabbd49109c3d4634304b020dc9796af7c65  # v1.19.1

jobs:
  audit:
    name: Audit the skills of this repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      code: ${{ steps.report.outputs.code }}
      report: ${{ steps.report.outputs.report }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the pinned checker
        run: |
          curl -fsSL "https://raw.githubusercontent.com/padosoft/skills/${SKILLS_REF}/skills/padosoft-skill-audit/scripts/audit_skills.py" \
            -o "$RUNNER_TEMP/audit_skills.py"

      # Exit 0 clean, 1 findings (ERROR; with --strict also WARN), 2 something could not be read.
      - name: Gate a pull request (errors only)
        if: github.event_name == 'pull_request'
        run: |
          # The checker prints paths taken from the repository, and the runner reads workflow commands
          # (::add-mask::, ::error::) in anything a step prints: a folder named like one could hide the
          # outputs below. A random token turns command processing off around everything it prints.
          stop="stop_$(head -c 12 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          echo "::stop-commands::$stop"
          set +e
          python3 "$RUNNER_TEMP/audit_skills.py" .
          code=$?
          echo "::$stop::"
          exit $code

      - name: Weekly report (errors and warnings)
        id: report
        if: github.event_name != 'pull_request'
        run: |
          # The checker prints paths taken from the repository, and the runner reads workflow commands
          # (::add-mask::, ::error::) in anything a step prints: a folder named like one could hide the
          # outputs below. A random token turns command processing off around everything it prints.
          stop="stop_$(head -c 12 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          set +e
          python3 "$RUNNER_TEMP/audit_skills.py" . --strict > "$RUNNER_TEMP/audit.txt"
          code=$?
          echo "::stop-commands::$stop"
          cat "$RUNNER_TEMP/audit.txt"
          echo "::$stop::"
          # The report is repository-derived text: a random delimiter keeps it from forging another output.
          delimiter="REPORT_$(head -c 12 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          {
            echo "code=$code"
            echo "report<<$delimiter"
            head -c 60000 "$RUNNER_TEMP/audit.txt"
            echo
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
          exit 0

      # The report step swallows the exit code so the next job can read it. Any code other than 0, 1 or 2
      # (a kill, an out-of-memory 137, a crash of the interpreter) means the audit did not finish: say so loudly.
      - name: Fail when the checker ended in an unexpected way
        if: github.event_name != 'pull_request' && steps.report.outputs.code != '0' && steps.report.outputs.code != '1' && steps.report.outputs.code != '2'
        run: |
          echo "::error::The checker exited with an unexpected code (${{ steps.report.outputs.code }}); the audit is incomplete."
          exit 1

      - name: Nothing could be checked
        if: github.event_name != 'pull_request' && steps.report.outputs.code == '2'
        run: echo "::warning::The checker could not read part of the repository; see the report above."

  report:
    name: Keep the report issue
    needs: audit
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      CODE: ${{ needs.audit.outputs.code }}
      REPORT: ${{ needs.audit.outputs.report }}
    steps:
      - name: Open or update the report issue
        if: env.CODE == '1'
        run: |
          {
            echo "The skills of this repository do not pass the \`padosoft-skill-audit\` checker."
            echo
            echo "To fix them: open a session in this repository and ask \"audit the skills of this repo and apply the report\"."
            echo "The skill reviews each skill before it edits, keeps what is specific to the project, and re-runs the checker."
            echo
            echo '```'
            printf '%s\n' "$REPORT"
            echo '```'
          } > "$RUNNER_TEMP/body.md"

          gh label create skills-audit --color 0E8A16 --description "Skills out of line with the authoring rules" 2>/dev/null || true
          existing=$(gh issue list --label skills-audit --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --title "Skills audit: findings" --label skills-audit --body-file "$RUNNER_TEMP/body.md"
          fi

      - name: Close the report issue when the skills are clean
        if: env.CODE == '0'
        run: |
          existing=$(gh issue list --label skills-audit --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "The checker reports no findings."
          fi
