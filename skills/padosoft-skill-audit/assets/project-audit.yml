name: Skills audit

# Copy this file to .github/workflows/skills-audit.yml in a project that keeps Agent Skills
# (.claude/skills, .agents/skills, .claude/commands).
#
# It runs the deterministic checker of padosoft-skill-audit: offline, Python standard library only, no secret,
# no model. It REPORTS and never edits:
#   - on a pull request that touches a skill, an ERROR-level finding fails the check;
#   - every week it keeps ONE open issue labelled "skills-audit" with the full report (warnings included) and
#     closes it when the report is clean.
# Fixing is a judgement job: open a session in the repository and ask the skill to apply the report.
#
# Whether the RULES are still current is checked centrally in padosoft/skills. A project does not need to check
# that: it gets new rules by updating the skill, and then bumps SKILLS_REF below to the release it installed.

on:
  pull_request:
    paths:
      - ".claude/skills/**"
      - ".claude/commands/**"
      - ".agents/skills/**"
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: skills-audit-${{ github.ref }}
  cancel-in-progress: false

env:
  # The padosoft/skills release the checker comes from when the skill is not installed in this repository.
  # Pin a release: a script fetched from a moving branch is code you did not review.
  SKILLS_REF: v1.19.0

jobs:
  audit:
    name: Audit the skills of this repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Prefer the copy installed in the repository, so the checker is the version of the skill you installed.
      - name: Find the checker
        run: |
          script=$(find . -name node_modules -prune -o -path '*/padosoft-skill-audit/scripts/audit_skills.py' -print | head -1)
          if [ -z "$script" ]; then
            curl -fsSL "https://raw.githubusercontent.com/padosoft/skills/${SKILLS_REF}/skills/padosoft-skill-audit/scripts/audit_skills.py" \
              -o "$RUNNER_TEMP/audit_skills.py"
            script="$RUNNER_TEMP/audit_skills.py"
          fi
          echo "Checker: $script"
          echo "SCRIPT=$script" >> "$GITHUB_ENV"

      # Exit 0 clean, 1 findings (ERROR; with --strict also WARN), 2 something could not be read.
      - name: Gate a pull request (errors only)
        if: github.event_name == 'pull_request'
        run: python3 "$SCRIPT" .

      - name: Weekly report (errors and warnings)
        id: report
        if: github.event_name != 'pull_request'
        run: |
          set +e
          python3 "$SCRIPT" . --strict > "$RUNNER_TEMP/audit.txt"
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/audit.txt"
          exit 0

      - name: Open or update the report issue
        if: github.event_name != 'pull_request' && steps.report.outputs.code == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "The skills of this repository do not pass the \`padosoft-skill-audit\` checker."
            echo
            echo "To fix them: open a session in this repository and ask \"audit the skills of this repo and apply the report\"."
            echo "The skill reviews each one before it edits, keeps what is specific to the project, and re-runs the checker."
            echo
            echo '```'
            head -c 60000 "$RUNNER_TEMP/audit.txt"
            echo '```'
          } > "$RUNNER_TEMP/body.md"

          gh label create skills-audit --color 0E8A16 --description "Skills out of line with the authoring rules" 2>/dev/null || true
          existing=$(gh issue list --label skills-audit --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --title "Skills audit: findings" --label skills-audit --body-file "$RUNNER_TEMP/body.md"
          fi

      - name: Close the report issue when the skills are clean
        if: github.event_name != 'pull_request' && steps.report.outputs.code == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --label skills-audit --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "The checker reports no findings."
          fi

      - name: Nothing could be checked
        if: github.event_name != 'pull_request' && steps.report.outputs.code == '2'
        run: |
          echo "::warning::The checker could not read part of the repository; see the report above."
          cat "$RUNNER_TEMP/audit.txt"
